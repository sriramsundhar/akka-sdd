# Runs the service against a local Postgres.
#
#   mvn clean install -DskipTests -Pstandalone -Ddocker.base.image=eclipse-temurin:25-jre-jammy
#   SERVICE_IMAGE=<image printed by the build> DB_PASSWORD=postgres docker compose up
services:
  postgres-db:
    image: postgres:17
    container_name: akka-sdd-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "postgres"]
      interval: 5s
      retries: 5
      start_period: 5s
      timeout: 5s

  akka-sdd:
    image: ${SERVICE_IMAGE:?set SERVICE_IMAGE to the image built with -Pstandalone}
    container_name: akka-sdd-service
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STANDALONE_SINGLE_NODE: "true"
      DB_HOST: postgres-db
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

volumes:
  postgres-data:
