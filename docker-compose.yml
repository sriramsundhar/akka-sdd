# Runs the service against a local Postgres.
#
#   mvn clean install -DskipTests -Pstandalone -Ddocker.base.image=eclipse-temurin:25-jre-jammy
#   SERVICE_IMAGE=<image printed by the build> DB_PASSWORD=postgres docker compose up
services:
  postgres-db:
    image: postgres:17
    container_name: akka-sdd-postgres
    ports:
      # Host port for psql/GUI clients. The service reaches Postgres over the
      # compose network on 5432, so this only needs to be free on the host.
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "postgres"]
      interval: 5s
      retries: 5
      start_period: 5s
      timeout: 5s

  # Web UI to browse the persisted data: http://localhost:8081
  # Log in with System "PostgreSQL", Server "postgres-db", user "postgres",
  # password = DB_PASSWORD (default "postgres"), database "postgres".
  # Akka tables: journal (events), snapshot, manifest, delete_entity.
  adminer:
    image: adminer:latest
    container_name: akka-sdd-adminer
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres-db

  # MongoDB for application data, using the Atlas Local image so Atlas
  # Search / Vector Search (used by RagIndexingWorkflow) work against
  # localhost:27017 the same way they would on a real Atlas cluster - the
  # plain community `mongo` image has no mongot process and rejects
  # $listSearchIndexes/createSearchIndex with SearchNotEnabled. Connect with:
  #   mongodb://mongo:${MONGO_PASSWORD:-mongo}@localhost:27017/?authSource=admin
  # (or mongo-db:27017 from other compose services). Local-development default
  # credentials only; set MONGO_PASSWORD for anything else. Note the env var
  # prefix is MONGODB_ (not MONGO_) for this image.
  mongo-db:
    image: mongodb/mongodb-atlas-local:latest
    container_name: akka-sdd-mongo
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: mongo
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "mongo", "-p", "${MONGO_PASSWORD:-mongo}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10
      start_period: 30s
      timeout: 5s

  akka-sdd:
    image: ${SERVICE_IMAGE:-akka-sdd:latest}  
    container_name: akka-sdd-service
    depends_on:
      postgres-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STANDALONE_SINGLE_NODE: "true"
      DB_HOST: postgres-db
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MONGODB_URI: mongodb://mongo:${MONGO_PASSWORD:-mongo}@mongo-db:27017/?authSource=admin

volumes:
  postgres-data:
  mongo-data:
