name: Container scan

# PR-only, unlike ci.yml: this scan's point is to comment findings on the
# PR, which only exists in a pull_request context. ci.yml's own `on:`
# comment explains why pull_request isn't added there instead - doing so
# here would double-run build/test/release, not just the scan.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  containerScan:
    runs-on: ubuntu-latest
    env:
      SERVICE_NAME: akka-sdd
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Configure Akka Maven repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <profiles>
              <profile>
                <id>akka-profile</id>
                <activation><activeByDefault>true</activeByDefault></activation>
                <repositories>
                  <repository>
                    <id>akka-repository</id>
                    <url>${AKKA_REPOSITORY_URL}</url>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>akka-plugin-repository</id>
                    <url>${AKKA_REPOSITORY_URL}</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>akka-profile</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          AKKA_REPOSITORY_URL: ${{ secrets.AKKA_REPOSITORY_URL }}

      - name: Build service image
        run: mvn -B clean install -DskipTests

      # Standalone (self-hosted, Postgres-backed) image. Distinct docker.image
      # so it doesn't retag/delete the regular build's image above (see
      # ci.yml's own copy of this step for the full explanation).
      - name: Build standalone service image
        run: |
          mvn -B clean install -DskipTests -Pstandalone \
            -Ddocker.base.image=eclipse-temurin:25-jre-jammy \
            -Ddocker.image="${SERVICE_NAME}-standalone"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sriramsundhar
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Scan service image with Docker Scout
        uses: docker/scout-action@v1.11.0
        with:
          command: cves,recommendations
          image: local://${{ env.SERVICE_NAME }}:latest
          to-latest: true
          ignore-base: true
          only-severities: critical,high
          sarif-file: sarif.service.output.json
          summary: true
          write-comment: true
          exit-on: vulnerability
          exit-code: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan standalone service image with Docker Scout
        uses: docker/scout-action@v1.11.0
        with:
          command: cves,recommendations
          image: local://${{ env.SERVICE_NAME }}-standalone:latest
          to-latest: true
          ignore-base: true
          only-severities: critical,high
          sarif-file: sarif.standalone.output.json
          summary: true
          write-comment: true
          exit-on: vulnerability
          exit-code: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
