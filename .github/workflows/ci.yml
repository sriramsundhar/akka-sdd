name: Java CI with Maven

concurrency:
  group: ${{ github.event_name }}-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SERVICE_NAME: akka-sdd
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Configure Akka Maven repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <profiles>
              <profile>
                <id>akka-profile</id>
                <activation><activeByDefault>true</activeByDefault></activation>
                <repositories>
                  <repository>
                    <id>akka-repository</id>
                    <url>${AKKA_REPOSITORY_URL}</url>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>akka-plugin-repository</id>
                    <url>${AKKA_REPOSITORY_URL}</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>akka-profile</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          AKKA_REPOSITORY_URL: ${{ secrets.AKKA_REPOSITORY_URL }}

      - name: Compile
        run: mvn -B compile

      - name: Test
        run: mvn -B verify

      - name: Build service image
        run: mvn -B clean install -DskipTests

      # Standalone (self-hosted, Postgres-backed) image. The parent pom's
      # standalone profile defaults to a Java 21 JRE, but this project compiles
      # for Java 25, so the base image must be overridden. Also uses a
      # distinct docker.image so it doesn't retag/delete the regular build's
      # image above (both default to the same artifactId-derived name).
      - name: Build standalone service image
        run: |
          mvn -B clean install -DskipTests -Pstandalone \
            -Ddocker.base.image=eclipse-temurin:25-jre-jammy \
            -Ddocker.image="${SERVICE_NAME}-standalone"

  scoutScan:
    runs-on: ubuntu-latest
    # Non-blocking: findings still show up (job-level failure in the Actions
    # UI, PR comment), but don't fail the pipeline or block release.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      SERVICE_NAME: akka-sdd
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Configure Akka Maven repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <profiles>
              <profile>
                <id>akka-profile</id>
                <activation><activeByDefault>true</activeByDefault></activation>
                <repositories>
                  <repository>
                    <id>akka-repository</id>
                    <url>${AKKA_REPOSITORY_URL}</url>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>akka-plugin-repository</id>
                    <url>${AKKA_REPOSITORY_URL}</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>akka-profile</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          AKKA_REPOSITORY_URL: ${{ secrets.AKKA_REPOSITORY_URL }}

      - name: Build service image
        run: mvn -B clean install -DskipTests

      - name: Build standalone service image
        run: |
          mvn -B clean install -DskipTests -Pstandalone \
            -Ddocker.base.image=eclipse-temurin:25-jre-jammy \
            -Ddocker.image="${SERVICE_NAME}-standalone"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sriramsundhar
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # The regular image's /opt/local-lib (the shipped app-level deps
      # Akka's docs say to scan: https://doc.akka.io/operations/integrating-cicd/scanning-dependencies.html#_scan_the_container_image)
      # is only populated by its entrypoint at container *start* - a static
      # image scan sees it empty. Build a throwaway image that copies the
      # same jars into /opt/local-lib at build time instead, purely so
      # Scout (an image-only scanner) has something to statically see.
      # The standalone image has no such split: it's self-hosted, so there
      # is no Akka-managed runtime to exclude - scan the whole thing.
      - name: Prepare service image scan target
        run: |
          cat > /tmp/Dockerfile.scan <<EOF
          FROM ${SERVICE_NAME}:latest AS source
          FROM scratch
          COPY --from=source /maven /opt/local-lib
          EOF
          docker build -t "${SERVICE_NAME}-scan:latest" -f /tmp/Dockerfile.scan .

      - name: Scan service image's shipped libraries with Docker Scout
        uses: docker/scout-action@v1.11.0
        with:
          command: cves,recommendations
          image: local://${{ env.SERVICE_NAME }}-scan:latest
          to-latest: true
          ignore-base: true
          only-severities: critical,high
          sarif-file: sarif.service.output.json
          summary: true
          write-comment: true
          exit-on: vulnerability
          exit-code: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan standalone service image with Docker Scout
        uses: docker/scout-action@v1.11.0
        with:
          command: cves,recommendations
          image: local://${{ env.SERVICE_NAME }}-standalone:latest
          to-latest: true
          ignore-base: true
          only-severities: critical,high
          sarif-file: sarif.standalone.output.json
          summary: true
          write-comment: true
          exit-on: vulnerability
          exit-code: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  snykScan:
    runs-on: ubuntu-latest
    # Non-blocking: findings still show up (job-level failure in the Actions
    # UI, PR comment), but don't fail the pipeline or block release.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      SERVICE_NAME: akka-sdd
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Configure Akka Maven repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <profiles>
              <profile>
                <id>akka-profile</id>
                <activation><activeByDefault>true</activeByDefault></activation>
                <repositories>
                  <repository>
                    <id>akka-repository</id>
                    <url>${AKKA_REPOSITORY_URL}</url>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>akka-plugin-repository</id>
                    <url>${AKKA_REPOSITORY_URL}</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>akka-profile</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          AKKA_REPOSITORY_URL: ${{ secrets.AKKA_REPOSITORY_URL }}

      - name: Build service image
        run: mvn -B clean install -DskipTests

      - name: Build standalone service image
        run: |
          mvn -B clean install -DskipTests -Pstandalone \
            -Ddocker.base.image=eclipse-temurin:25-jre-jammy \
            -Ddocker.image="${SERVICE_NAME}-standalone"

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      # Run via the CLI directly rather than snyk/actions/docker: that
      # action fails the step immediately on findings, before a comment can
      # be posted. Capturing output and deferring the pass/fail decision to
      # the last step lets the PR comment post either way, same as Scout's
      # write-comment does.
      #
      # The regular image scan targets the shipped-libraries folder, not
      # the image, per Akka's docs
      # (https://doc.akka.io/operations/integrating-cicd/scanning-dependencies.html#_scan_the_shipped_libraries):
      # mvn's build already wrote exactly the app-level deps there (19
      # jars, no netty/jackson/etc - those are Akka-managed runtime, out of
      # scope for us). The standalone image bundles that runtime itself
      # (self-hosted, no shared-responsibility split), so it's still
      # scanned as a whole image below.
      - name: Scan service image's shipped libraries with Snyk
        id: snyk-service
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --scan-all-unmanaged --severity-threshold=high \
            -- --target-dir="target/docker/${SERVICE_NAME}/latest/build/maven/" \
            | tee snyk-service-output.txt || true
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Scan standalone service image with Snyk
        id: snyk-standalone
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test "${SERVICE_NAME}-standalone:latest" --severity-threshold=high \
            | tee snyk-standalone-output.txt || true
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Comment Snyk results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Snyk's CLI output includes ANSI color escape codes, which
            // GitHub comments render as literal garbled characters rather
            // than color - strip them rather than relying on a CLI flag.
            const stripAnsi = (s) => s.replace(/[\u001B\u009B][[\]()#;?]*(?:[0-9]{1,4}(?:;[0-9]{0,4})*)?[0-9A-ORZcf-nqry=><]/g, '');
            const service = stripAnsi(fs.readFileSync('snyk-service-output.txt', 'utf-8'));
            const standalone = stripAnsi(fs.readFileSync('snyk-standalone-output.txt', 'utf-8'));
            const body = [
              '## Snyk container scan results',
              '<details><summary>akka-sdd shipped libraries (/opt/local-lib)</summary>\n\n```\n' + service + '\n```\n</details>',
              '<details><summary>akka-sdd-standalone:latest (full image)</summary>\n\n```\n' + standalone + '\n```\n</details>',
            ].join('\n\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if Snyk found high/critical vulnerabilities
        if: steps.snyk-service.outputs.exit_code != '0' || steps.snyk-standalone.outputs.exit_code != '0'
        run: |
          echo "::error::Snyk found high/critical vulnerabilities - see the scan output above (or the PR comment)."
          exit 1

  release:
    # [skip ci] on the version-bump commits below stops this from re-triggering itself.
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [build, scoutScan, snykScan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write
    env:
      SERVICE_NAME: akka-sdd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Configure Akka Maven repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <profiles>
              <profile>
                <id>akka-profile</id>
                <activation><activeByDefault>true</activeByDefault></activation>
                <repositories>
                  <repository>
                    <id>akka-repository</id>
                    <url>${AKKA_REPOSITORY_URL}</url>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>akka-plugin-repository</id>
                    <url>${AKKA_REPOSITORY_URL}</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>akka-profile</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          AKKA_REPOSITORY_URL: ${{ secrets.AKKA_REPOSITORY_URL }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute release and next development versions
        id: version
        run: |
          CURRENT=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::pom.xml version '$CURRENT' is not MAJOR.MINOR.PATCH-SNAPSHOT (semantic versioning). Fix pom.xml before merging." >&2
            exit 1
          fi
          RELEASE=${CURRENT%-SNAPSHOT}
          # Every release is a patch bump (MAJOR.MINOR.PATCH -> MAJOR.MINOR.PATCH+1).
          # To ship a minor/major release instead, edit pom.xml's <version> to the
          # desired MAJOR.MINOR.0-SNAPSHOT before merging to main.
          NEXT=$(echo "$RELEASE" | awk -F. -v OFS=. '{ $NF += 1; print }')-SNAPSHOT
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Set release version and tag
        run: |
          mvn -B -q versions:set -DnewVersion="${{ steps.version.outputs.release }}" -DgenerateBackupPoms=false
          git commit -am "chore(release): ${{ steps.version.outputs.release }} [skip ci]"
          git tag "v${{ steps.version.outputs.release }}"

      - name: Test
        run: mvn -B verify

      - name: Build service image and jar
        id: image
        run: |
          TAG="${{ steps.version.outputs.release }}-$(date -u +%Y%m%d%H%M%S)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mvn -B clean install -DskipTests -Ddocker.tag="$TAG"

      - name: Build standalone service image
        run: |
          # Distinct docker.image (not just a distinct tag): the standalone
          # build shares the same artifactId-derived image name as the
          # regular build by default, so building it second would retag
          # "akka-sdd:latest" and delete the previous (now-untagged) image -
          # taking the regular build's uniquely-timestamped tag with it,
          # since that tag is just another reference to the same image id.
          mvn -B clean install -DskipTests -Pstandalone \
            -Ddocker.base.image=eclipse-temurin:25-jre-jammy \
            -Ddocker.image="${SERVICE_NAME}-standalone" \
            -Ddocker.tag="${{ steps.image.outputs.tag }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: |
          IMAGE="${SERVICE_NAME}:${{ steps.image.outputs.tag }}"
          GHCR_BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "$IMAGE" "${GHCR_BASE}:${{ steps.version.outputs.release }}"
          docker tag "$IMAGE" "${GHCR_BASE}:latest"
          docker push "${GHCR_BASE}:${{ steps.version.outputs.release }}"
          docker push "${GHCR_BASE}:latest"
          STANDALONE="${SERVICE_NAME}-standalone:${{ steps.image.outputs.tag }}"
          docker tag "$STANDALONE" "${GHCR_BASE}:${{ steps.version.outputs.release }}-standalone"
          docker push "${GHCR_BASE}:${{ steps.version.outputs.release }}-standalone"

      - name: Set next development version
        run: |
          mvn -B -q versions:set -DnewVersion="${{ steps.version.outputs.next }}" -DgenerateBackupPoms=false
          git commit -am "chore: prepare for next development iteration (${{ steps.version.outputs.next }}) [skip ci]"

      - name: Push commits and tag
        run: git push origin HEAD:main "v${{ steps.version.outputs.release }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.release }}" \
            "target/${SERVICE_NAME}-${{ steps.version.outputs.release }}.jar" \
            --title "v${{ steps.version.outputs.release }}" \
            --generate-notes \
            --notes "Container image: ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.version.outputs.release }}"

      # workflow_dispatch/repository_dispatch are the only triggers exempt
      # from GitHub's restriction that events created by the built-in
      # GITHUB_TOKEN don't cascade into new workflow runs - a `release`
      # event here would not reach cd.yml, so dispatch it explicitly.
      - name: Trigger CD deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run cd.yml -f version="${{ steps.version.outputs.release }}"
