name: Java CI with Maven

concurrency:
  group: ${{ github.event_name }}-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

on:
  # Only push, not pull_request: a same-repo PR shares its commit with the
  # source branch, so adding pull_request here would run the workflow twice
  # for the same commit.
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Configure Akka Maven repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <profiles>
              <profile>
                <id>akka-profile</id>
                <activation><activeByDefault>true</activeByDefault></activation>
                <repositories>
                  <repository>
                    <id>akka-repository</id>
                    <url>${AKKA_REPOSITORY_URL}</url>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>akka-plugin-repository</id>
                    <url>${AKKA_REPOSITORY_URL}</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>akka-profile</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          AKKA_REPOSITORY_URL: ${{ secrets.AKKA_REPOSITORY_URL }}

      - name: Compile
        run: mvn -B compile

      - name: Test
        run: mvn -B verify

      - name: Build service image
        run: mvn -B clean install -DskipTests

  release:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AKKA_SERVICE_NAME: akka-sdd
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Configure Akka Maven repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <profiles>
              <profile>
                <id>akka-profile</id>
                <activation><activeByDefault>true</activeByDefault></activation>
                <repositories>
                  <repository>
                    <id>akka-repository</id>
                    <url>${AKKA_REPOSITORY_URL}</url>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>akka-plugin-repository</id>
                    <url>${AKKA_REPOSITORY_URL}</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>akka-profile</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          AKKA_REPOSITORY_URL: ${{ secrets.AKKA_REPOSITORY_URL }}

      - name: Build service image
        run: mvn -B clean install -DskipTests

      - name: Resolve image tag
        id: image
        run: |
          TAG=$(mvn -q help:evaluate -Dexpression=docker.tag -DforceStdout)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install Akka CLI
        uses: akka/setup-akka-cli-action@v1
        with:
          token: ${{ secrets.AKKA_TOKEN }}
          project-id: ${{ secrets.AKKA_PROJECT_ID }}

      - name: Deploy service
        run: |
          akka service deploy "${AKKA_SERVICE_NAME}" \
            "${AKKA_SERVICE_NAME}:${{ steps.image.outputs.tag }}" \
            --push
