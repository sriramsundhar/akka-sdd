name: Java CI with Maven

concurrency:
  group: ${{ github.event_name }}-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Compile
        run: mvn -B compile

      - name: Test
        run: mvn -B verify

      - name: Build service image
        run: mvn -B clean install -DskipTests

  release:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AKKA_SERVICE_NAME: akka-sdd
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Build service image
        run: mvn -B clean install -DskipTests

      - name: Resolve image tag
        id: image
        run: |
          TAG=$(mvn -q help:evaluate -Dexpression=docker.tag -DforceStdout)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install Akka CLI
        uses: akka/setup-akka-cli-action@v1
        with:
          token: ${{ secrets.AKKA_TOKEN }}
          project-id: ${{ secrets.AKKA_PROJECT_ID }}

      - name: Deploy service
        run: |
          akka service deploy "${AKKA_SERVICE_NAME}" \
            "${AKKA_SERVICE_NAME}:${{ steps.image.outputs.tag }}" \
            --push
