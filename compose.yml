services:
  postgres-db:
    image: postgres:17
    container_name: akka-sdd-postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "postgres"]
      interval: 5s
      retries: 5
      start_period: 5s
      timeout: 5s

  adminer:
    image: adminer:latest
    container_name: akka-sdd-adminer
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres-db

  mongo-db:
    image: mongodb/mongodb-atlas-local:latest
    container_name: akka-sdd-mongo
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: mongo
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "mongo", "-p", "${MONGO_PASSWORD:-mongo}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10
      start_period: 30s
      timeout: 5s

  akka-sdd:
    image: ${SERVICE_IMAGE:-akka-sdd:latest}  
    container_name: akka-sdd-service
    depends_on:
      postgres-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STANDALONE_SINGLE_NODE: "true"
      DB_HOST: postgres-db
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      MONGODB_URI: mongodb://mongo:${MONGO_PASSWORD:-mongo}@mongo-db:27017/?authSource=admin&directConnection=true
      AGENT_MODEL_PROVIDER: "vertex-ai"
      VERTEX_AI_API_KEY: ${VERTEX_AI_API_KEY:?set VERTEX_AI_API_KEY before running the service}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY before running the service}
      # Free key from https://account.akka.io/key. Without one the runtime
      # falls back to a trial key that expires and self-terminates the service.
      AKKA_LICENSE_KEY: ${AKKA_LICENSE_KEY:?set AKKA_LICENSE_KEY before running the service}


volumes:
  postgres-data:
  mongo-data:
