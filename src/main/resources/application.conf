akka.javasdk {
  agent {
    model-provider = litellm

    anthropic {
      model-name = "claude-opus-4-6"
      api-key = ${?ANTHROPIC_API_KEY}
      max-tokens = 200
    }

    vertex-ai {
      project = "genai-482920"
      location = "global"
      model-name = "gemini-3.8-flash"
      api-key = ${?VERTEX_AI_API_KEY}
    }

    gemini {
      project = "projects/737923792895"
      location = "global"
      model-name = "text-embedding-004"
      api-key = ${?GEMINI_API_KEY}
    }

    # LiteLLM proxy (https://www.litellm.ai/), running locally, exposing an
    # OpenAI-compatible API in front of gpt-4o-mini. Start it with:
    #   litellm --model gpt-4o-mini --port 4000
    litellm = ${akka.javasdk.agent.openai}
    litellm {
      model-name = "gpt-4o-mini"
      base-url = "http://localhost:4000"
      api-key = "sk-1234"
      api-key = ${?LITELLM_API_KEY}
    }
  }
}

# Postgres backing store for entities, workflows and views. Only used when the
# service runs standalone (container image or `akka local cluster`); plain
# `mvn exec:java` and the testkit use an in-memory store. Tables are created
# automatically, but the database and credentials must exist.
akka.persistence.r2dbc {
  connection-factory {
    host = "localhost"
    host = ${?DB_HOST}
    port = 5432
    port = ${?DB_PORT}
    database = "postgres"
    database = ${?DB_DATABASE}
    user = "postgres"
    user = ${?DB_USER}
    # Local-development default only; override with DB_PASSWORD anywhere else.
    password = "postgres"
    password = ${?DB_PASSWORD}
  }
}

# MongoDB connection for application data (see the `mongo-db` service in
# docker-compose.yml). The Akka SDK has no built-in MongoDB integration: read
# these values from code with the MongoDB Java driver. The defaults are
# local-development credentials only; override MONGODB_URI anywhere else.
mongodb {
  uri = "mongodb://mongo:mongo@localhost:27017/?authSource=admin"
  uri = ${?MONGODB_URI}
  database = "akka-sdd"
  database = ${?MONGODB_DATABASE}
}
