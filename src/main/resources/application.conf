# This is the deployment config: what the Akka platform and the standalone
# image load by default (there's no system property available on either
# path to swap in a different file, unlike mvn compile exec:java - see
# application-dev.conf for local development instead).
#
# Free key from https://account.akka.io/key. Without one, the standalone
# runtime falls back to a built-in trial key with a hard expiry date, after
# which it self-terminates (cleanly, but the service stops serving). Not
# needed for local dev or the Akka platform, only for a standalone/
# self-hosted deployment.
akka.license-key = ""
akka.license-key = ${?AKKA_LICENSE_KEY}

akka.javasdk {
  agent {
    # Deployment default. compose.yml and .github/deploy/akka-sdd-service.yml
    # both already set AGENT_MODEL_PROVIDER=vertex-ai explicitly too, so this
    # default only matters as a fallback if that env var is ever missing.
    model-provider = "vertex-ai"
    model-provider = ${?AGENT_MODEL_PROVIDER}

    # Using api-key auth, so project-id and location must stay empty (Akka's
    # Vertex AI provider rejects mixing api-key with project-id+location -
    # that combination produced RESOURCE_PROJECT_INVALID from the real
    # Vertex AI endpoint, since project-id/location select ADC-based auth).
    # Only relevant where model-provider is overridden to "vertex-ai".
    vertex-ai {
      model-name = "gemini-3.8-flash"
      api-key = ""
      api-key = ${?VERTEX_AI_API_KEY}
    }

    # LiteLLM proxy (https://www.litellm.ai/). GreeterAgent always uses this
    # provider by name (ModelProvider.fromConfig("litellm")), in every
    # environment, not just locally - base-url must be overridden wherever
    # this runs outside your own machine, since "localhost" won't resolve
    # to anything there.
    #
    # For local development, run a proxy on your machine exposing an
    # OpenAI-compatible API in front of gpt-4o-mini:
    #   litellm --model gpt-4o-mini --port 4000
    litellm = ${akka.javasdk.agent.openai}
    litellm {
      model-name = "gpt-4o-mini"
      base-url = "http://localhost:4000"
      base-url = ${?LITELLM_BASE_URL}
      api-key = "sk-1234"
      api-key = ${?LITELLM_API_KEY}
    }
  }
  dev-mode.persistence.enabled = true
}

# Log-only data sanitization sample (see README "Log sanitization sample").
# Every entry masks log output only (apply-at = ["logs"]); matched text becomes
# '*' of the same length. Masking happens in the JSON log format used on the
# Akka platform and by the standalone image, not in the dev-mode console format.
# Each entry runs on every log line, including Akka's own: keep the list short.
akka.javasdk.sanitization.sanitizers {
  "log-email"       { predefined = EMAIL,       apply-at = ["logs"] }
  "log-phone"       { predefined = PHONE,       apply-at = ["logs"] }
  "log-credit-card" { predefined = CREDIT_CARD, apply-at = ["logs"] }
  "log-iban"        { predefined = IBAN,        apply-at = ["logs"] }
  "log-ip-address"  { predefined = IP_ADDRESS,  apply-at = ["logs"] }

  # Masks the values of these fields in JSON ("ssn":"...") and key=value log text,
  # keeping the field names visible.
  "log-sensitive-fields" {
    class    = "com.example.sanitizer.SensitiveFieldLogSanitizer"
    apply-at = ["logs"]
    fields   = ["password", "ssn", "dateOfBirth", "securityAnswer"]
  }
}
