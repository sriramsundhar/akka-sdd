# Local-development config. Not loaded automatically - pass it explicitly:
#   mvn compile exec:java -Dconfig.resource=application-dev.conf
#
# Same mechanism the standalone Docker image's entrypoint already uses to
# swap in runtime-standalone.conf, and the one TestKitSupport uses
# automatically for src/test/resources/application-test.conf (see
# akka-context/sdk/setup-and-dependency-injection.html.md, "Test
# configuration"): include the deployment config, then override just what
# local development needs to differ.
include "application.conf"

akka.javasdk.agent {
  # WeatherAgent, ActivityAgent and EvaluatorAgent use whichever provider
  # this resolves to (GreeterAgent always uses litellm regardless, see
  # application.conf). litellm needs no cloud API key - just a local proxy:
  #   litellm --model gpt-4o-mini --port 4000
  model-provider = "litellm"
}
