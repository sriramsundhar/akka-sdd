  tier: product
  dod_type: functional
  provenance: ""
  invariant: no language is greeted twice in a session until every pool language has
    been used at least once
  signal: ""
  probe: ""
  pass: ""
  autonomy: auto
  default_level: ""
  auditor:
    run:
    - mvn
    - -q
    - test
    - -Dtest=GreeterRotationTest
    applies_to:
      requirement: FR-003
      module: greeter-agent
- id: FUNC-GREETER-SESSION-ISOLATION
  tier: product
  dod_type: functional
  provenance: ""
  invariant: a session's used-language history is never influenced by, or leaked into,
    another session's history
  signal: ""
  probe: ""
  pass: ""
  autonomy: auto
  default_level: ""
  auditor:
    run:
    - mvn
    - -q
    - test
    - -Dtest=GreeterSessionIsolationTest
    applies_to:
      requirement: FR-005
      module: greeter-agent
- id: FUNC-GREETER-POOL-EXHAUSTION-RECOVERY
  tier: product
  dod_type: functional
  provenance: ""
  invariant: once every pool language has been used in a session, the agent continues
    to return valid greetings by restarting the rotation least-recently-used-first
  signal: ""
  probe: ""
  pass: ""
  autonomy: auto
  default_level: ""
